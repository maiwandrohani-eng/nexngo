  <rect x="180" y="140" width="840" height="240" rx="24" fill="#0a3044" stroke="#6cfaf2" stroke-opacity="0.5"/>
  <g fill="#dffefe" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">
