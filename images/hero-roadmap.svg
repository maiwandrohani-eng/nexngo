<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Roadmap and milestones">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#051a2b"/>
      <stop offset="100%" stop-color="#0f445d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <path d="M140 610 C250 470 360 470 470 610 S690 750 800 610 S1010 470 1060 610" fill="none" stroke="#86fff7" stroke-width="16" stroke-linecap="round"/>
  <g fill="#13b7ba" stroke="#aafffb" stroke-width="4">
