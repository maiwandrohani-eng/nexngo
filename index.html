<head>

  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; background: #06141E; color: #E7EDF5; }
    .page-fade { transition: opacity 0.35s ease-in-out, transform 0.35s ease-in-out; opacity: 1; transform: translateY(0); }

    .nav-link-active { color: #0f6a73; background: rgba(46,196,182,0.14); }
    .glass { background: rgba(6, 20, 35, 0.80); backdrop-filter: blur(10px); border: 1px solid rgba(60, 164, 171, 0.25); }
    .sysmap { background: linear-gradient(180deg, rgba(7,23,35,0.95), rgba(8,28,42,0.98)); border: 1px solid rgba(58, 176, 187, 0.34); box-shadow: 0 16px 40px rgba(2,8,18,0.65); border-radius: 1rem; }
    .sysmap::before { content: ''; position: absolute; inset: 14px 50% 14px 50%; width: 4px; transform: translateX(-50%); background: linear-gradient(to bottom, rgba(46,196,182,0.9), rgba(46,196,182,0.15)); border-radius: 999px; filter: drop-shadow(0 0 16px rgba(46,196,182,0.65)); }
    .node-stack { position: relative; width: min(360px, 90%); margin: 0 auto; padding: 2.6rem 0; display: flex; flex-direction: column; gap: 1.1rem; z-index: 1; }
    .node { border-radius: 999px; padding: 0.95rem 1.4rem; text-align: center; font-weight: 700; font-size: 1.05rem; color: #E7F7FB; background: rgba(12,98,107,0.87); box-shadow: 0 0 20px rgba(46,196,182,0.35); border: 1px solid rgba(56, 180, 187, 0.7); position: relative; animation: float 2.8s ease-in-out infinite alternate; }
    .node-primary { background: linear-gradient(120deg, rgba(32,151,159,0.92), rgba(11,97,104,0.9)); }
    .node-secondary { background: linear-gradient(120deg, rgba(19,128,137,0.9), rgba(12,98,107,0.86)); }
    .node::after { content: ''; position: absolute; left: calc(50% - 4px); top: 100%; width: 8px; height: 32px; background: linear-gradient(to bottom, rgba(46,196,182,0.95), rgba(46,196,182,0.2)); border-radius: 999px; box-shadow: 0 0 14px rgba(46,196,182,0.8); }
    .node:last-child::after { display: none; }
    .dot { position: absolute; left: 50%; width: 14px; height: 14px; border-radius: 999px; background: #2ec4b6; box-shadow: 0 0 18px rgba(46,196,182,0.96), 0 0 34px rgba(46,196,182,0.44); animation: rush 4s ease-in-out infinite; top: 34px; transform: translateX(-50%); }
    @keyframes float { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }
    @keyframes rush { 0% { top: 38px; opacity: 0.95; } 35% { top: 132px; opacity: 0.95; } 65% { top: 272px; opacity: 0.95; } 100% { top: 404px; opacity: 0.06; } }
    .form-field { border: 1px solid rgba(112, 207, 218, 0.3); background: rgba(8,25,35,0.82); color: #e9f6ff; border-radius: 0.7rem; padding: 0.95rem; width: 100%; }
    .form-field:focus { outline: 2px solid rgba(46,196,182,0.8); border-color: rgba(46,196,182,0.9); }
    .dropdown-trigger { position: relative; }
    .dropdown-menu { display: none; position: absolute; top: 110%; left: 0; background: rgba(4,22,35,0.96); border: 1px solid rgba(46,196,182,0.35); border-radius: 0.65rem; box-shadow: 0 18px 30px rgba(1,7,16,0.75); min-width: 220px; z-index: 60; }
    .dropdown-trigger:hover .dropdown-menu { display: block; }
    .dropdown-link { display: block; padding: 0.55rem 0.9rem; border-radius: 0.55rem; color: #C9E3ED; text-align: left; font-size: 0.92rem; }
    .dropdown-link:hover { background: rgba(46,196,182,0.18); color: #ffffff; }
    .pulse-glow { animation: pulseGlow 2.8s ease-in-out infinite; }
    .layered { position: relative; z-index: 1; }
    .hero-grid {
      position: absolute; inset: 0; pointer-events: none; opacity: 0.35;
      background-image: linear-gradient(to right, rgba(13,45,61,0.16) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(13,45,61,0.16) 1px, transparent 1px);
      background-size: 44px 44px;
      transform: scale(1.1);
      animation: drift 26s linear infinite;
    }
    .hero-particles {
      position: absolute; inset: 0; pointer-events: none; overflow: hidden;
    }
    .hero-particle {
      position: absolute; width: 4px; height: 4px; border-radius: 50%;
      background: rgba(44,220,214,0.9); box-shadow: 0 0 12px rgba(44,220,214,.8);
      animation: particleRise var(--p-time, 8s) linear infinite;
    }
    .sys-visual { position: relative; margin-top: 2rem; min-height: 450px; }
    .sys-node {
      position: absolute; width: 152px; padding: 0.85rem 0.9rem;
      border-radius: 16px; background: rgba(8,28,40,0.88);
      border: 1px solid rgba(44,220,214,0.35);
      box-shadow: 0 0 28px rgba(7,152,160,0.25);
      cursor: pointer; transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    }
    .sys-line { position: absolute; width: 2px; background: rgba(44,220,214,0.45); transform-origin: top; transition: background .25s ease, opacity .25s ease; }
    .sys-node.hovered { transform: translateY(-6px) scale(1.05); box-shadow: 0 0 28px rgba(31, 242, 237, 0.6); border-color: rgba(44,220,214,0.8); }
    .sys-node-teaser {
      margin-top: 0.35rem;
      font-size: 11px;
      line-height: 1.25rem;
      color: rgba(189, 245, 255, 0.92);
      min-height: 2.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .overflow-layer { position: absolute; inset: 0; pointer-events: none;}
    @keyframes drift { 0% { transform: translateY(0) scale(1.1); } 100% { transform: translateY(-34px) scale(1.1); } }
    @keyframes particleRise { 0% { transform: translate(0, 120%); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(0, -30%); opacity: 0; } }
    @keyframes pulseGlow { 0%,100% { box-shadow: 0 0 20px rgba(46,196,182,0.3); } 50% { box-shadow: 0 0 30px rgba(46,196,182,0.45); } }
    .home-panel { background: linear-gradient(145deg, rgba(8,23,36,0.8), rgba(7,29,42,0.9)); border: 1px solid rgba(46,196,182,0.23); backdrop-filter: blur(2px); }
    .interactive-card { transition: transform .25s ease, background .25s ease, box-shadow .25s ease; }
    .interactive-card:hover { transform: translateY(-8px); background: rgba(20,85,100,0.9); box-shadow: 0 12px 28px rgba(17,113,122,0.35); }
    .sys-card { position: relative; border: 1px solid rgba(46,196,182,.3); background: rgba(1,12,24,0.92); padding: 1.1rem; border-radius: 1rem; }
    .sys-card::before { content: ''; position: absolute; inset: -16px; border-radius: 1.2rem; background: linear-gradient(150deg, rgba(46,196,182,.08), rgba(13,98,107,.12)); filter: blur(16px); opacity: 0.7; z-index: -1; }
    .section-offset { transform: skewY(-2deg); }
    .section-offset .section-inner { transform: skewY(2deg); }
    .section-gradient { background: radial-gradient(circle at top left, rgba(45,220,214,0.24), rgba(7,21,34,0.9)); }
    .expandable { min-height: 3.1rem; transition: all .2s ease; }
    .expandable:hover .expand-target { max-height: 240px; opacity: 1; }
    .expand-target { max-height: 0; overflow: hidden; opacity: 0; transition: max-height .3s ease, opacity .3s ease; }    
    .section-max { max-width: 1400px; }
    .analytics-chip {
      display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(15,70,95,0.32); border: 1px solid rgba(45,200,210,.25); border-radius: 999px; padding: .35rem .75rem; font-size: .9rem;
    }
    .stat-card { background: rgba(12,45,62,.7); border: 1px solid rgba(40,170,188,.35); border-radius: 1rem; padding: 1rem 1.1rem; box-shadow: inset 0 0 14px rgba(0,0,0,.22), 0 10px 20px rgba(0,0,0,.18); transition: transform .3s ease, box-shadow .3s ease; }
    .stat-card:hover { transform: translateY(-4px); box-shadow: inset 0 0 20px rgba(0,0,0,.25), 0 14px 24px rgba(0,0,0,.24); }
    .stat-value { font-size: 2.2rem; font-weight: 700; color: #f0ffff; }
    .stat-label { color: #b9e8ef; font-size: .95rem; }
    .code-point { font-family: 'Inter', monospace; font-size: .83rem; color: #78e8ff; background: rgba(8,23,34,0.6); border: 1px solid rgba(42,195,201,0.3); border-radius: .65rem; padding: .2rem .5rem; }
    .sys-visual::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle at 45% 20%, rgba(111,210,222,.16), transparent 38%), radial-gradient(circle at 78% 77%, rgba(16,234,221,.12), transparent 42%); pointer-events: none; }
    .sys-node { min-width: 152px; min-height: 98px; }
    .section-dynamic { background: linear-gradient(145deg, rgba(1,14,25,.96), rgba(2,18,34,.92)); border-top: 1px solid rgba(45, 190, 205, 0.14); }
    .motion-underline { position: relative; display: inline-block; }
    .motion-underline::after { content: ''; position: absolute; left: 0; bottom: -6px; width: 0; height: 2px; background: linear-gradient(90deg, #23fee6, #0ff0e5); transition: width .25s ease; }
    .motion-underline:hover::after { width: 100%; }
  </style>

<body class="min-h-screen bg-[#041223] text-slate-100">

  <script>
    const { useState, useEffect } = React;

    function App() {
      const initialPage = window.location.hash ? window.location.hash.replace('#','') : 'home';
      const validPages = ['home','about','solutions','nonprofits','businesses','approach','insights','contact','packages','addons'];
      const [page, setPage] = useState(validPages.includes(initialPage) ? initialPage : 'home');
      const [locale, setLocale] = useState('en');
      const [hoverNode, setHoverNode] = useState(null);
      const [selectedNode, setSelectedNode] = useState(null);
      const [activeService, setActiveService] = useState(null);
      const [selectedNonprofit, setSelectedNonprofit] = useState(null);
      const [selectedBusiness, setSelectedBusiness] = useState(null);
      const [activeApproach, setActiveApproach] = useState(null);
      const [selectedSolutionModule, setSelectedSolutionModule] = useState(null);
      const [selectedInsight, setSelectedInsight] = useState(null);
      const [selectedPackage, setSelectedPackage] = useState(null);
      const [contactStatus, setContactStatus] = useState(null);

      const socialLinks = [
        { id: 'instagram', label: 'Instagram', handle: '@nexngo', href: 'https://instagram.com/nexngo', icon: 'instagram' },
        { id: 'linkedin', label: 'LinkedIn', handle: 'nexngo', href: 'https://linkedin.com/company/nexngo', icon: 'linkedin' },
        { id: 'facebook', label: 'Facebook', handle: 'nexngo', href: 'https://facebook.com/nexngo', icon: 'facebook' },
        { id: 'x', label: 'X', handle: '@nexngo', href: 'https://x.com/nexngo', icon: 'x' },
        { id: 'youtube', label: 'YouTube', handle: '@nexngo', href: 'https://youtube.com/@nexngo', icon: 'youtube' }
      ];

      const renderSocialIcon = (icon) => {
        const base = { className: 'h-4 w-4', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '1.8', strokeLinecap: 'round', strokeLinejoin: 'round', 'aria-hidden': 'true' };

        if (icon === 'instagram') {
          return React.createElement('svg', base,
            React.createElement('rect', { x: '3', y: '3', width: '18', height: '18', rx: '5' }),
            React.createElement('circle', { cx: '12', cy: '12', r: '4.25' }),
            React.createElement('circle', { cx: '17.5', cy: '6.5', r: '1' })
          );
        }

        if (icon === 'linkedin') {
          return React.createElement('svg', base,
            React.createElement('path', { d: 'M8 10v7' }),
            React.createElement('path', { d: 'M12 17v-4a2.5 2.5 0 0 1 5 0v4' }),
            React.createElement('circle', { cx: '8', cy: '7', r: '1' })
          );
        }

        if (icon === 'facebook') {
          return React.createElement('svg', base,
            React.createElement('path', { d: 'M14.5 8H16V5.5h-2a3.5 3.5 0 0 0-3.5 3.5V11H8.5v2.5h2V19h2.5v-5.5h2.2L15.8 11H13V9a1 1 0 0 1 1-1Z' })
          );
        }

        if (icon === 'youtube') {
          return React.createElement('svg', base,
            React.createElement('path', { d: 'M21 12s0-3-1-4c-1.1-1.1-8-1-8-1s-6.9-.1-8 1c-1 1-1 4-1 4s0 3 1 4c1.1 1.1 8 1 8 1s6.9.1 8-1c1-1 1-4 1-4Z' }),
            React.createElement('path', { d: 'm10 9 5 3-5 3Z', fill: 'currentColor', stroke: 'none' })
          );
        }

        return React.createElement('svg', base,
          React.createElement('path', { d: 'M4 4 20 20' }),
          React.createElement('path', { d: 'M20 4 4 20' })
        );
      };

      const nonprofitScenarios = [
        {
          id: 'grant-compliance',
          title: 'Grant Compliance & Audit Readiness',
          titleTr: 'Hibe Uyumu ve Denetime Hazırlık',
          highlights: ['Stay ahead of every donor obligation', 'Eliminate missed reporting deadlines', 'Be audit-ready before the reviewer arrives'],
          highlightsTr: ['Her bağışçı yükümlülüğünde önde kalın', 'Raporlama son tarihlerini kaçırmayın', 'Denetçi gelmeden denetime hazır olun'],
          detail: 'Most NGOs face donor scrutiny not because of poor delivery, but because compliance tracking, reporting, and contract management are scattered. This path covers Modules 3, 4, and 12 — building a structured system for obligation tracking, financial controls, and regulatory readiness. Typical outcomes: fewer missed deadlines, cleaner audit trails, and stronger donor confidence in how your organization manages its commitments.',
          detailTr: 'STK\'ların çoğu, zayıf teslimat nedeniyle değil; uyum takibi, raporlama ve sözleşme yönetiminin dağınık olması nedeniyle bağışçı sorgulamalarıyla karşılaşır. Bu yol, Modüller 3, 4 ve 12\'yi kapsar — yükümlülük takibi, finansal kontroller ve yasal hazırlık için yapılandırılmış bir sistem kurar. Tipik sonuçlar: daha az kaçırılan son tarih, daha temiz denetim izleri ve kuruluşunuzun taahhütlerini nasıl yönettiğine dair daha güçlü bağışçı güveni.'
        },
        {
          id: 'impact-measurement',
          title: 'Impact Measurement & Program Evidence',
          titleTr: 'Etki Ölçümü ve Program Kanıtı',
          highlights: ['Prove the outcomes your programs actually deliver', 'Collect beneficiary data with confidence', 'Turn field evidence into donor-ready reporting'],
          highlightsTr: ['Programlarınızın yarattığı sonuçları kanıtlayın', 'Faydalanıcı verilerini güvenle toplayın', 'Saha kanıtını bağışçıya hazır raporlamaya dönüştürün'],
          detail: 'Donors increasingly expect credible outcome evidence, not just activity summaries. This path covers Modules 9, 10, and 11 — building stronger beneficiary tracking, outcome indicators, and impact communication systems. Typical outcomes: more credible evidence for grant renewals, better-structured donor reports, and clearer internal learning from every program cycle.',
          detailTr: 'Bağışçılar, yalnızca faaliyet özetleri değil, güvenilir sonuç kanıtı bekler. Bu yol, Modüller 9, 10 ve 11\'i kapsar — daha güçlü faydalanıcı takibi, sonuç göstergeleri ve etki iletişimi kurar. Tipik sonuçlar: yenilemeler için daha güvenilir kanıt, daha iyi yapılandırılmış bağışçı raporları ve her program döngüsünden daha net iç öğrenme.'
        },
        {
          id: 'fundraising-efficiency',
          title: 'Funding Readiness & Grant Strategy',
          titleTr: 'Finansman Hazırlığı ve Hibe Stratejisi',
          highlights: ['Focus on grants your NGO is positioned to win', 'Improve proposal quality before submission', 'Build a more reliable, scalable funding pipeline'],
          highlightsTr: ['STK\'nızın kazanmaya en uygun hibelerini hedefleyin', 'Teklif kalitesini başvurudan önce artırın', 'Daha güvenilir ve ölçeklenebilir bir finansman hattı kurun'],
          detail: 'Fundraising is more competitive and donor requirements are more rigorous than ever. This path covers Modules 1, 2, and 3 — helping you build a smarter grant pipeline, align proposals with donor priorities, and put a governance structure in place that earns early trust. Typical outcomes: more qualified opportunities in your pipeline, stronger proposals, and faster movement from shortlisting to award.',
          detailTr: 'Finansman rekabeti her zamankinden daha yoğun, bağışçı gereksinimleri daha titiz. Bu yol, Modüller 1, 2 ve 3\'ü kapsar — daha akıllı bir hibe hattı kurmanıza, teklifleri bağışçı öncelikleriyle hizalamanıza ve erken güven kazanan bir yönetişim yapısı oluşturmanıza yardımcı olur. Tipik sonuçlar: daha nitelikli fırsatlar, daha güçlü teklifler ve kısa listeden ödüle daha hızlı geçiş.'
        }
      ];

      const businessScenarios = [
        {
          id: 'integrated-finance',
          title: 'Financial Visibility & Planning Discipline',
          titleTr: 'Finansal Görünürlük ve Planlama Disiplini',
          highlights: ['Replace reactive reporting with forward-looking financial controls', 'Give leadership cleaner, faster P&L visibility', 'Build forecasts that adapt as the business changes'],
          highlightsTr: ['Reaktif raporlamanın yerine ileriye dönük finansal kontroller koyun', 'Liderliğe daha temiz ve hızlı kâr-zarar görünürlüğü sağlayın', 'İşletme değiştikçe güncellenen tahminler kurun'],
          detail: 'When finance data is fragmented or delayed, decisions slow down and accountability becomes blurred. This path connects financial planning, management controls, and leadership reporting into a tighter operating discipline. Typical outcomes: forecasts leadership can trust, problems identified earlier, and a financial control structure that works across the full business.',
          detailTr: 'Finans verileri dağınık veya gecikmeli olduğunda kararlar yavaşlar ve hesap verebilirlik belirsizleşir. Bu yol, finansal planlamayı, yönetim kontrollerini ve liderlik raporlamasını daha sıkı bir işletim disiplinine bağlar. Tipik sonuçlar: liderlerin güvendiği tahminler, sorunların daha erken tespiti ve tüm işletmede çalışan finansal kontrol yapısı.'
        },
        {
          id: 'risk-operations',
          title: 'Risk, Controls & Operational Performance',
          titleTr: 'Risk, Kontroller ve Operasyonel Performans',
          highlights: ['Make risk visible before it becomes a problem', 'Build controls that are tracked, not just documented', 'Connect operational signals directly to leadership decisions'],
          highlightsTr: ['Riski sorun haline gelmeden görünür kılın', 'Yalnızca belgelenmiş değil, aktif takip edilen kontroller kurun', 'Operasyonel sinyalleri doğrudan liderlik kararlarına bağlayın'],
          detail: 'Most organizations have risk registers but no live view of where risk is actually moving. This path introduces active risk monitoring, control testing routines, and performance signals that give leadership a clearer view of operational health. Typical outcomes: fewer escalation surprises, controls embedded in daily operations, and a leadership dashboard that reflects reality.',
          detailTr: 'Çoğu kuruluşun risk kaydı vardır, ancak riskin gerçekte nereye hareket ettiğine dair canlı bir görünüm yoktur. Bu yol, aktif risk izleme, kontrol test rutinleri ve liderliğe operasyonel sağlığın daha net görünümünü sunan performans sinyallerini içerir. Tipik sonuçlar: daha az eskalasyon sürprizi, günlük operasyonlara yerleştirilmiş kontroller ve gerçekliği yansıtan bir liderlik panosu.'
        },
        {
          id: 'data-governance',
          title: 'Reporting Quality & Decision Intelligence',
          titleTr: 'Raporlama Kalitesi ve Karar İstihbaratı',
          highlights: ['Reduce time spent reconciling conflicting data', 'Give leadership one reliable source of reporting truth', 'Make reports useful for decisions, not just compliance'],
          highlightsTr: ['Çelişen verileri uzlaştırmak için harcanan zamanı azaltın', 'Liderliğe tek güvenilir raporlama kaynağı sağlayın', 'Raporları yalnızca uyum için değil, kararlar için kullanışlı hale getirin'],
          detail: 'When different teams report different numbers and metrics have no agreed definition, leadership loses confidence in its data. This path establishes a shared KPI framework, cleaner data flows, and a reporting structure that is useful in real decisions — not just in board packs. Typical outcomes: less time on reconciliation, faster insight cycles, and leadership that trusts what the reports say.',
          detailTr: 'Farklı ekipler farklı rakamlar raporladığında ve metriklerin üzerinde uzlaşılmış bir tanımı olmadığında liderlik verisine olan güven azalır. Bu yol, ortak bir KPI çerçevesi, daha temiz veri akışları ve gerçek kararlarda kullanılabilir bir raporlama yapısı kurar. Tipik sonuçlar: uzlaşmaya harcanan daha az zaman, daha hızlı içgörü döngüleri ve liderlerin güvendiği raporlar.'
        }
      ];

      const solutionModuleDetails = {
        en: {
          1: { summary: 'Establishes the executive control layer that aligns strategy, policies, and risk ownership across the organization.', focus: ['Board and committee decision rights', 'Risk appetite and escalation thresholds', 'Governance calendar with review cadences'] },
          2: { summary: 'Builds a repeatable funding engine that prioritizes qualified opportunities and strengthens proposal readiness.', focus: ['Funding pipeline scoring model', 'Donor fit and compliance filters', 'Submission workflow and review checkpoints'] },
          3: { summary: 'Creates a single compliance register for donor obligations, reporting milestones, and contract changes.', focus: ['Grant and contract obligation tracking', 'Automated reporting deadline alerts', 'Audit trail for donor communications'] },
          4: { summary: 'Connects budgets, ledgers, and controls so financial performance can be monitored with confidence.', focus: ['Multi-fund budget structures', 'Approval and exception controls', 'Audit-ready reporting packs'] },
          5: { summary: 'Standardizes sourcing, purchasing, and inventory movements to reduce cost and compliance risk.', focus: ['Procurement policy workflows', 'Vendor and bid documentation', 'Supply continuity visibility'] },
          6: { summary: 'Makes asset ownership, condition, and location traceable throughout the full operating lifecycle.', focus: ['Asset registers and tagging rules', 'Maintenance and replacement planning', 'Loss prevention and accountability logs'] },
          7: { summary: 'Strengthens people operations with clear workforce controls, role design, and policy-backed HR workflows.', focus: ['Recruitment and onboarding controls', 'Payroll and people-cost transparency', 'Performance and policy compliance records'] },
          8: { summary: 'Provides delivery discipline for programs and projects from planning through execution and closure.', focus: ['Milestone and dependency mapping', 'Budget-to-activity traceability', 'Issue escalation and decision logs'] },
          9: { summary: 'Introduces safe, traceable beneficiary workflows that protect vulnerable groups and improve service quality.', focus: ['Beneficiary registration controls', 'Safeguarding incident handling', 'Consent and case traceability'] },
          10: { summary: 'Turns program evidence into structured learning loops that improve performance and donor reporting.', focus: ['Outcome indicator design', 'Evidence collection and validation', 'Learning reviews and improvement actions'] },
          11: { summary: 'Coordinates message, visibility, and partner reporting so impact communication stays consistent and credible.', focus: ['Campaign and reporting calendar', 'Donor visibility requirements', 'Impact storytelling standards'] },
          12: { summary: 'Keeps the organization aligned with legal registrations, tax obligations, and jurisdiction-specific rules.', focus: ['Regulatory filing schedule', 'Policy and statutory obligation tracking', 'Eligibility readiness for donor audits'] },
          13: { summary: 'Creates the security and data discipline needed for resilient operations and trusted reporting.', focus: ['Access control and data roles', 'Security baseline and incident response', 'Data governance and retention rules'] },
          14: { summary: 'Designs resilient field and remote operating practices for distributed teams working in complex environments.', focus: ['Remote coordination routines', 'Duty-of-care and field safety controls', 'Offline-to-online reporting continuity'] }
